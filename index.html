</style>
<canvas id="c"></canvas>
<div id="menu">
  <div class="box" id="mainBox">
    <h1>SWARM</h1>
    <button id="bCreate">Create party</button>
    <div class="row"><input id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters"><button id="bJoin" style="width:110px">Join</button></div>
    <button id="bSolo" class="ghost">Play solo</button>

  </div>

  </div>
</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W, H, dpr, Z = 1;
function resize(){
  dpr = devicePixelRatio||1; W = innerWidth; H = innerHeight; cv.width = W*dpr; cv.height = H*dpr;
  Z = Math.max(.5, Math.min(1.3, Math.min(W/1100, H/700)));   // same world view for everyone
}
addEventListener('resize', resize); resize();

// ================= audio =================
let ac;
function initAudio(){ if(!ac){ try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(_){} } }
function tone(f, dur=0.1, type='sine', vol=0.1, slide=0){
  if(!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime;
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide), t0+dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
  o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0+dur);
}
const note = n => 261.63*Math.pow(2,n/12);
const pent = [0,2,4,7,9,12,14,16,19,21,24,26,28];
let lastKillSnd = 0, lastGemSnd = 0;

// ================= data =================
const TYPELIST = [
  {name:'chaser', r:11, hp:18,  spd:72,  dmg:10, xp:1, col:'#ff4d6d'},
  {name:'fast',   r:8,  hp:9,   spd:135, dmg:8,  xp:2, col:'#ffd23f'},
  {name:'tank',   r:22, hp:110, spd:46,  dmg:20, xp:6, col:'#a35cff'},
  {name:'shooter',r:11, hp:30,  spd:62,  dmg:8,  xp:3, col:'#ff9f1c'},
  {name:'charger',r:14, hp:50,  spd:80,  dmg:22, xp:4, col:'#ff3d00'},
  {name:'splitter',r:20,hp:75,  spd:55,  dmg:14, xp:4, col:'#3dd6c6'},
  {name:'boss',   r:46, hp:700, spd:38,  dmg:30, xp:0, col:'#ff2fd0'},
];
const ARENA=1700;
const needXp=(l,np)=>Math.floor((4+3.2*l+.5*l*l)*(1+.5*(np-1)));
const COLS = [[125,255,178],[94,230,255],[255,210,63],[255,159,69],[217,139,255],[255,122,184]];
const css = c => `rgb(${COLS[c%6]})`;
const REV = 2.5;
const UPGRADES = [
  {n:'Twin Shot',   d:'+1 projectile',         f:p=>p.multi++,        ok:p=>p.multi<5},
  {n:'Rapid Fire',  d:'+20% fire rate',        f:p=>p.rate*=1.2,      ok:p=>p.rate<6},
  {n:'Hot Rounds',  d:'+25% damage',           f:p=>p.dmg*=1.25,      ok:p=>p.dmg<60},
  {n:'Piercing',    d:'bullets go through +1', f:p=>p.pierce++,       ok:p=>p.pierce<4},
  {n:'Boots',       d:'+10% move speed',       f:p=>p.spd*=1.1,       ok:p=>p.spd<290},
  {n:'Magnet',      d:'+50% pickup range',     f:p=>p.magnet*=1.5,    ok:p=>p.magnet<260},
  {n:'Vitality',    d:'+25 max HP, heal 25',   f:p=>{p.max+=25;p.hp=Math.min(p.max,p.hp+25)}, ok:p=>p.max<300},
  {n:'Orbit Blade', d:'+1 spinning blade',     f:p=>p.blades++,       ok:p=>p.blades<5},
  {n:'Shockwave',   d:'bigger, faster pulse',  f:p=>p.nova++,         ok:p=>p.nova<5},
  {n:'Fast Bullets',d:'+25% bullet speed',     f:p=>p.bspd*=1.25,     ok:p=>p.bspd<900},
];

// ================= game state =================
let screen='menu', state='menu';          // state: lobby | play | levelup | dead
let isHost=true, myId='h', partyCode='', peer=null, hostConn=null; const conns={};
let players=[], enemies=[], bullets=[], ebullets=[], gems=[], parts=[], texts=[], rings=[];
let mapSeed=0, obst=[], pools=[], shrines=[], decor=[], nextBoss=60;
let t=0, kills=0, xp=0, next=5, lvl=1, spawnAcc=0, nextWave=30, pickT=0, eid=0, plCount=0;
let shake=0, banner='', bannerT=0, streak=0, streakT=0, deadAt=0;
let evq=[], netBuf=[];
let best=0; try{ best=+localStorage.getItem('swarm_best')||0 }catch(e){}
let hover=-1;

const rnd=(a,b)=>a+Math.random()*(b-a);
const rd=Math.round;
const me=()=>players.find(p=>p.id===myId);
const pushEv=e=>evq.push(e);

function makePlayer(id,c,n){
  return {id,c,n,x:0,y:0,vx:0,vy:0,dx:0,dy:0,hp:100,max:100,spd:210,r:10,inv:0,fireCd:0,rate:2.6,dmg:10,multi:1,pierce:0,
          bspd:520,magnet:80,blades:0,ang:0,nova:0,novaCd:3,dead:false,reviveT:0,rv:0,pc:null};
}
function addPlayer(id){
  const used=new Set(players.map(p=>p.c)); let c=0; while(used.has(c)) c++;
  const p=makePlayer(id,c,++plCount);
  const ref=players.find(q=>!q.dead);
  if(ref){p.x=ref.x+30;p.y=ref.y+30;}
  players.push(p); return p;
}
function removePlayer(id){
  players=players.filter(p=>p.id!==id);
  if(isHost) checkPicksDone();
}
function resetWorld(){
  enemies=[];bullets=[];ebullets=[];gems=[];parts=[];texts=[];rings=[];
  t=0;kills=0;xp=0;lvl=1;spawnAcc=0;nextWave=30;nextBoss=60;streak=0;eid=0;
  next=needXp(1,players.length);
  genMap(1+Math.floor(Math.random()*1e9));
  players=players.map((p,i)=>{
    const q=makePlayer(p.id,p.c,p.n); const a=i/players.length*6.283; q.x=Math.cos(a)*30*(players.length>1?1:0); q.y=Math.sin(a)*30*(players.length>1?1:0); return q;
  });
}

// ================= map =================
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function genMap(seed){
  mapSeed=seed; const R=mulberry(seed); obst=[]; pools=[]; shrines=[]; decor=[];
  for(let n=0;n<400&&obst.length<46;n++){
    const r=28+R()*48, a=R()*6.283, d=Math.sqrt(R())*(ARENA-140);
    const x=Math.cos(a)*d, y=Math.sin(a)*d;
    if(d<260) continue;
    if(obst.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r+110)) continue;
    obst.push({x,y,r});
  }
  for(let n=0;n<200&&pools.length<7;n++){
    const r=70+R()*45, a=R()*6.283, d=Math.sqrt(R())*(ARENA-200), x=Math.cos(a)*d, y=Math.sin(a)*d;
    if(d<340) continue;
    if(obst.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r+20)||pools.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+r+80)) continue;
    pools.push({x,y,r});
  }
  for(let n=0;n<200&&shrines.length<3;n++){
    const a=R()*6.283, d=420+R()*820, x=Math.cos(a)*d, y=Math.sin(a)*d;
    if(obst.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+110)||pools.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+110)||shrines.some(o=>Math.hypot(o.x-x,o.y-y)<500)) continue;
    shrines.push({x,y,r:62});
  }
  for(const o of obst){ o.v=R(); }
  for(let n=0;n<900&&decor.length<300;n++){
    const a=R()*6.283, d=Math.sqrt(R())*(ARENA-90), x=Math.cos(a)*d, y=Math.sin(a)*d, z=R(), sz=.7+R()*.8;
    if(obst.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+10)||pools.some(o=>Math.hypot(o.x-x,o.y-y)<o.r)) continue;
    let k;
    if(d<600) k=z<.35?3:z<.7?2:z<.85?1:0;
    else if(d<1250) k=z<.35?0:z<.6?4:z<.85?2:1;
    else k=z<.4?1:z<.7?5:2;
    decor.push({x,y,k,s:sz,a:R()*6.283});
  }
}
function pushOut(o){   // o has x,y,r: keep inside the arena and out of pillars
  for(const b of obst){
    const dx=o.x-b.x, dy=o.y-b.y, m=b.r+o.r, d2=dx*dx+dy*dy;
    if(d2<m*m){const d=Math.sqrt(d2)||1; o.x=b.x+dx/d*m; o.y=b.y+dy/d*m;}
  }
  const d=Math.hypot(o.x,o.y), lim=ARENA-o.r;
  if(d>lim){o.x*=lim/d;o.y*=lim/d;}
}
function inPool(p){ for(const q of pools) if((p.x-q.x)**2+(p.y-q.y)**2<q.r*q.r) return true; return false; }
function clampArena(x,y,m){ const d=Math.hypot(x,y), lim=ARENA-m; return d>lim?{x:x*lim/d,y:y*lim/d}:{x,y}; }

// ================= input =================
const keys={}; const ptr={down:false,x:0,y:0};
function getInput(){
  let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0);
  let dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);
  if(!dx&&!dy&&ptr.down){
    const px=ptr.x-W/2,py=ptr.y-H/2,d=Math.hypot(px,py);
    if(d>12){dx=px/d;dy=py/d;}
  }
  const m=Math.hypot(dx,dy);
  return m>1?{dx:dx/m,dy:dy/m}:{dx,dy};
}
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  initAudio(); keys[e.code]=true;
  if(['Space','Enter','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  if(screen!=='game') return;
  if(state==='dead' && isHost && performance.now()-deadAt>600 && (e.code==='Space'||e.code==='Enter'||e.code==='KeyR')) restartGame();
  if(state==='levelup' && ['Digit1','Digit2','Digit3'].includes(e.code)) choose(+e.code.slice(5)-1);
});
addEventListener('keyup',e=>keys[e.code]=false);
cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); initAudio();
  ptr.down=true; ptr.x=e.clientX; ptr.y=e.clientY;
  if(screen!=='game') return;
  if(state==='dead' && isHost && performance.now()-deadAt>600) restartGame();
  else if(state==='levelup'){const i=cardAt(e.clientX,e.clientY); if(i>=0) choose(i);}
});
cv.addEventListener('pointermove',e=>{ptr.x=e.clientX;ptr.y=e.clientY; if(state==='levelup') hover=cardAt(e.clientX,e.clientY);});
addEventListener('pointerup',()=>ptr.down=false);

// ================= level-up =================
function levelUpStart(){
  state='levelup'; pickT=14; pushEv(['lv']);
  for(const p of players){
    if(p.dead){p.pc=null;continue;}
    const pool=UPGRADES.map((_,i)=>i).filter(i=>UPGRADES[i].ok(p)), pc=[];
    while(pc.length<3) pc.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
    p.pc=pc;
  }
}
function checkPicksDone(){ if(state==='levelup' && !players.some(p=>p.pc)) state='play'; }
function pickFor(id,i){
  const p=players.find(q=>q.id===id);
  if(!p||!p.pc||p.pc[i]===undefined) return;
  UPGRADES[p.pc[i]].f(p); p.pc=null; pushEv(['up',p.x,p.y,p.c]); checkPicksDone();
}
function choose(i){
  const m=me(); if(!m||!m.pc||m.pc[i]===undefined) return;
  if(isHost) pickFor(myId,i);
  else { hostConn&&hostConn.open&&hostConn.send({t:'pick',i}); m.pc=null; }
}
function cardGeom(i){
  const cw=Math.min(210,(W-60)/3), ch=Math.min(250,H*.5), gap=16, total=cw*3+gap*2;
  return {x:W/2-total/2+i*(cw+gap),y:H/2-ch/2,w:cw,h:ch};
}
function cardAt(x,y){
  for(let i=0;i<3;i++){const g=cardGeom(i); if(x>=g.x&&x<=g.x+g.w&&y>=g.y&&y<=g.y+g.h) return i;}
  return -1;
}

// ================= host simulation =================
function nearestAlive(x,y){
  let b=null,bd=1e18;
  for(const p of players){ if(p.dead) continue; const d=(p.x-x)**2+(p.y-y)**2; if(d<bd){bd=d;b=p;} }
  return b;
}
function spawnEnemy(ti,x,y,hpScale=1){
  const T=TYPELIST[ti], hpm=(1+t/30+(t/150)**2)*hpScale, c=clampArena(x,y,T.r+4);
  const hp=T.hp*hpm*(ti===3?.8:1);
  enemies.push({id:++eid,type:T.name,ti,x:c.x,y:c.y,r:T.r,hp,max:hp,spd:T.spd*rnd(.9,1.1)*(1+Math.min(t/300,.5)),
                dmg:T.dmg*(1+t/240),xp:T.xp,col:T.col,flash:0,kx:0,ky:0,bladeCd:0,
                st:0,tm:0,cd:rnd(.5,2.5),cd2:6,dx:0,dy:0,dir:Math.random()<.5?1:-1,aux:0,ang:0});
}
function hurtEnemy(e,dmg,dx,dy,kb){
  if(e.ti===6) kb*=.06;
  e.hp-=dmg; e.flash=.12;
  const d=Math.hypot(dx,dy)||1; e.kx+=dx/d*kb; e.ky+=dy/d*kb;
  if(evq.length<60) pushEv(['h',rd(e.x),rd(e.y-e.r),rd(dmg)]);
}

function hurtPlayer(p,dmg){
  if(p.dead) return;
  p.hp-=dmg;
  if(p.hp<=0){p.hp=0;p.dead=true;p.reviveT=0;p.pc=null;pushEv(['die',rd(p.x),rd(p.y),p.id]);}
}
function pickType(){
  const w=[[0,10],[1,t>18?3:0],[3,t>35?2.5:0],[2,t>55?1.5+t/200:0],[4,t>70?2:0],[5,t>95?1.3:0]];
  let s=0; for(const x of w) s+=x[1];
  let r=Math.random()*s; for(const x of w){ if((r-=x[1])<=0) return x[0]; }
  return 0;
}
function simWorld(dt){
  const al=players.filter(p=>!p.dead);
  if(!al.length){gameOver();return;}
  t+=dt;
  const np=players.length;

  // ---- players ----
  for(const p of players){
    if(p.dead){
      let near=0; for(const q of al) if((q.x-p.x)**2+(q.y-p.y)**2<80*80) near++;
      p.reviveT=near?p.reviveT+dt:Math.max(0,p.reviveT-dt*.5);
      if(p.reviveT>=REV){p.dead=false;p.hp=p.max*.5;p.inv=1.5;p.reviveT=0;pushEv(['rev',rd(p.x),rd(p.y)]);}
      continue;
    }
    const inP=inPool(p), sm=inP?.55:1, k=Math.min(1,dt*14);
    p.vx+=(p.dx*p.spd*sm-p.vx)*k; p.vy+=(p.dy*p.spd*sm-p.vy)*k; p.x+=p.vx*dt; p.y+=p.vy*dt; p.inv-=dt;
    pushOut(p);
    if(inP){ hurtPlayer(p,(7+t/25)*dt); if(p.dead) continue; }
    for(const q of shrines) if((p.x-q.x)**2+(p.y-q.y)**2<q.r*q.r){ p.hp=Math.min(p.max,p.hp+4*dt); break; }

    p.fireCd-=dt;
    if(p.fireCd<=0 && enemies.length){
      let tg=null,bd=640*640;
      for(const e of enemies){const d=(e.x-p.x)**2+(e.y-p.y)**2; if(d<bd){bd=d;tg=e;}}
      if(tg){
        p.fireCd=1/p.rate;
        const base=Math.atan2(tg.y-p.y,tg.x-p.x);
        for(let i=0;i<p.multi;i++){
          const a=base+(i-(p.multi-1)/2)*.17;
          bullets.push({x:p.x,y:p.y,vx:Math.cos(a)*p.bspd,vy:Math.sin(a)*p.bspd,pierce:p.pierce,hit:new Set(),life:1.1,dmg:p.dmg,c:p.c});
        }
        pushEv(['sh',p.id]);
      }
    }
    if(p.blades){
      p.ang+=dt*(3.2+p.blades*.2);
      for(let i=0;i<p.blades;i++){
        const a=p.ang+i/p.blades*6.283, bx=p.x+Math.cos(a)*78, by=p.y+Math.sin(a)*78;
        for(const e of enemies){
          if(e.bladeCd>0) continue;
          const rr=e.r+11;
          if((e.x-bx)**2+(e.y-by)**2<rr*rr){e.bladeCd=.28;hurtEnemy(e,p.dmg*.7,e.x-p.x,e.y-p.y,220);}
        }
      }
    }
    if(p.nova){
      p.novaCd-=dt;
      if(p.novaCd<=0){
        p.novaCd=Math.max(1.4,5-.7*p.nova);
        const R=120+p.nova*28;
        pushEv(['ring',rd(p.x),rd(p.y),R,COLS[p.c].join(',')]);
        for(const e of enemies) if((e.x-p.x)**2+(e.y-p.y)**2<(R+e.r)**2) hurtEnemy(e,p.dmg*2.2,e.x-p.x,e.y-p.y,420);
        pushEv(['nova']);
      }
    }
  }

  // ---- bullets ----
  for(const b of bullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    for(const o of obst) if((b.x-o.x)**2+(b.y-o.y)**2<o.r*o.r){b.life=0;break;}
    if(b.life<=0) continue;
    for(const e of enemies){
      if(b.hit.has(e)) continue;
      const rr=e.r+5;
      if((e.x-b.x)**2+(e.y-b.y)**2<rr*rr){
        b.hit.add(e); hurtEnemy(e,b.dmg,b.vx,b.vy,160);
        if(b.pierce--<=0){b.life=0;break;}
      }
    }
  }
  bullets=bullets.filter(b=>b.life>0);

  // ---- enemy bullets ----
  for(const b of ebullets){
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    for(const o of obst) if((b.x-o.x)**2+(b.y-o.y)**2<o.r*o.r){b.life=0;break;}
    if(b.life<=0) continue;
    for(const p of al){
      if(p.dead||p.inv>0) continue;
      if((p.x-b.x)**2+(p.y-b.y)**2<(p.r+6)**2){
        b.life=0; p.inv=.5; hurtPlayer(p,b.dmg); pushEv(['ph',rd(p.x),rd(p.y),p.id]); break;
      }
    }
  }
  ebullets=ebullets.filter(b=>b.life>0);

  // ---- spawning ----
  const cap=Math.min(420,260+80*np), mult=1+.65*(al.length-1);
  spawnAcc+=dt*(1.6+t/9)*mult;
  while(spawnAcc>=1 && enemies.length<cap){
    spawnAcc--;
    const tp=al[Math.floor(Math.random()*al.length)], a=Math.random()*6.283;
    spawnEnemy(pickType(),tp.x+Math.cos(a)*720,tp.y+Math.sin(a)*720);
  }
  if(spawnAcc>6) spawnAcc=6;
  if(t>=nextWave){
    nextWave+=30; pushEv(['wave']);
    const tp=al[Math.floor(Math.random()*al.length)], n=Math.floor((24+t/6)*(1+.5*(al.length-1)));
    for(let i=0;i<n;i++){const a=i/n*6.283; spawnEnemy(t>90&&i%5==0?2:0,tp.x+Math.cos(a)*540,tp.y+Math.sin(a)*540);}
  }
  if(t>=nextBoss){
    nextBoss+=75; pushEv(['bossin']);
    const tp=al[Math.floor(Math.random()*al.length)], a=Math.random()*6.283;
    spawnEnemy(6,tp.x+Math.cos(a)*620,tp.y+Math.sin(a)*620,1.4*(1+.7*(np-1)));
  }

  // ---- enemies ----
  for(const e of enemies){
    e.bladeCd-=dt; e.flash-=dt;
    const tg=nearestAlive(e.x,e.y); if(!tg) continue;
    const ex=tg.x-e.x, ey=tg.y-e.y, d=Math.hypot(ex,ey)||1, ux=ex/d, uy=ey/d;
    let mx=ux, my=uy, sp=e.spd; e.aux=0;
    if(e.ti===3){            // shooter: keeps its distance and fires
      if(d<230){mx=-ux;my=-uy;} else if(d<320){mx=-uy*e.dir;my=ux*e.dir;sp*=.6;}
      e.cd-=dt;
      if(e.cd<=0&&d<620){e.cd=2.3;ebullets.push({x:e.x,y:e.y,vx:ux*250,vy:uy*250,life:4,dmg:e.dmg*1.3});}
    } else if(e.ti===4){     // charger: telegraphs, locks on, dashes
      if(e.st===0){e.cd-=dt; if(e.cd<=0&&d<440){e.st=1;e.tm=.75;}}
      else if(e.st===1){sp=0;e.aux=1;e.tm-=dt;e.dx=ux;e.dy=uy;if(e.tm<=0){e.st=2;e.tm=.5;}}
      else{mx=e.dx;my=e.dy;sp=620;e.aux=2;e.tm-=dt;if(e.tm<=0){e.st=0;e.cd=2.2;}}
    } else if(e.ti===6){     // boss: slow, bullet rings, summons
      e.cd-=dt; e.cd2-=dt; e.ang+=dt;
      if(e.cd<=0){e.cd=2.6;const n=16;for(let i=0;i<n;i++){const a=e.ang+i/n*6.283;ebullets.push({x:e.x,y:e.y,vx:Math.cos(a)*200,vy:Math.sin(a)*200,life:5,dmg:e.dmg*.7});}}
      if(e.cd2<=0){e.cd2=9;for(let i=0;i<8;i++){const a=i/8*6.283;spawnEnemy(0,e.x+Math.cos(a)*80,e.y+Math.sin(a)*80,.8);}}
    }
    e.x+=(mx*sp+e.kx)*dt; e.y+=(my*sp+e.ky)*dt;
    const k=Math.exp(-7*dt); e.kx*=k; e.ky*=k;
    pushOut(e);
    if(tg.inv<=0 && Math.hypot(tg.x-e.x,tg.y-e.y)<e.r+tg.r){
      tg.inv=.7; hurtPlayer(tg,e.dmg);
      pushEv(['ph',rd(tg.x),rd(tg.y),tg.id]);
      if(e.ti!==6){e.kx=-ux*300; e.ky=-uy*300;}
    }
  }
  if(players.every(p=>p.dead)){gameOver();return;}

  // ---- kills ----
  const alive=[];
  for(const e of enemies){
    if(e.hp>0){alive.push(e);continue;}
    kills++;
    if(e.ti===6){
      pushEv(['boss',rd(e.x),rd(e.y)]); xp+=next;
      for(let i=0;i<3;i++) gems.push({x:e.x+rnd(-30,30),y:e.y+rnd(-30,30),v:0,heart:true});
    } else {
      gems.push({x:e.x,y:e.y,v:e.xp,heart:false});
      if(Math.random()<.006) gems.push({x:e.x+8,y:e.y,v:0,heart:true});
    }
    if(e.ti===5) for(let i=0;i<3;i++){const a=i/3*6.283+Math.random();spawnEnemy(0,e.x+Math.cos(a)*18,e.y+Math.sin(a)*18,.6);}
    pushEv(['k',rd(e.x),rd(e.y),e.ti]);
  }
  enemies=alive;

  // ---- gems ----
  for(const g of gems){
    const p=nearestAlive(g.x,g.y); if(!p) continue;
    const gx=p.x-g.x, gy=p.y-g.y, d=Math.hypot(gx,gy)||1;
    if(d<p.magnet){const sp=300+(p.magnet-d)*6; g.x+=gx/d*sp*dt; g.y+=gy/d*sp*dt;}
    if(d<p.r+8){
      g.got=true;
      if(g.heart){p.hp=Math.min(p.max,p.hp+15);pushEv(['heal',rd(p.x),rd(p.y)]);}
      else{xp+=g.v;pushEv(['gp',p.id]);}
    }
  }
  gems=gems.filter(g=>!g.got);
  if(gems.length>500) gems.splice(0,gems.length-500);

  if(xp>=next){xp-=next;lvl++;next=needXp(lvl,players.length);levelUpStart();}
}

function snapshot(){
  const en=[]; for(const e of enemies) en.push(e.id,rd(e.x),rd(e.y),e.ti,e.flash>0?1:0,Math.max(0,rd(100*e.hp/e.max)),e.aux);
  const eb=[]; for(const q of ebullets) eb.push(rd(q.x),rd(q.y),rd(q.vx),rd(q.vy));
  const b=[]; for(const q of bullets) b.push(rd(q.x),rd(q.y),rd(q.vx),rd(q.vy),q.c);
  const g=[]; for(const q of gems) g.push(rd(q.x),rd(q.y),q.heart?3:q.v>=5?2:q.v>=2?1:0);
  return {t:'s',st:state,tm:+t.toFixed(2),k:kills,xp,nx:next,lv:lvl,code:partyCode,sd:mapSeed,
    p:players.map(p=>({i:p.id,n:p.n,x:rd(p.x),y:rd(p.y),h:Math.ceil(p.hp),m:p.max,d:p.dead?1:0,iv:p.inv>0?1:0,bl:p.blades,a:+p.ang.toFixed(2),
                       mg:p.magnet,c:p.c,rv:+p.rv.toFixed(2),sp:p.spd,nv:p.nova,wt:p.pc?1:0})),
    en,eb,b,g,e:netBuf};

function sendSnapshots(){
  const ids=Object.keys(conns); if(!ids.length){netBuf=[];return;}
  const s=snapshot(); netBuf=[];
  for(const id of ids){
    const c=conns[id]; if(!c.open) continue;
    const p=players.find(q=>q.id===id);
    c.send(p&&p.pc?Object.assign({},s,{pc:p.pc}):s);
  }
}
function onConn(conn){
  conn.on('open',()=>{
    if(players.length>=6){conn.send({t:'full'});setTimeout(()=>conn.close(),300);return;}
    conns[conn.peer]=conn; addPlayer(conn.peer);
  });
  conn.on('data',d=>{
    const p=players.find(q=>q.id===conn.peer); if(!p||!d) return;
    if(d.t==='in'){const m=Math.hypot(d.dx,d.dy); p.dx=m>1?d.dx/m:+d.dx||0; p.dy=m>1?d.dy/m:+d.dy||0;}
    else if(d.t==='pick') pickFor(conn.peer,d.i);
  });
  const gone=()=>{delete conns[conn.peer];removePlayer(conn.peer);};
  conn.on('close',gone); conn.on('error',gone);
}

function onClientData(s){
  if(s.t==='full'){hostGone();setMsg('Party is full (6 max).',true);return;}
  if(s.t!=='s') return;
  const prev=state;
  state=s.st; t=s.tm; kills=s.k; xp=s.xp; next=s.nx; lvl=s.lv; partyCode=s.code||partyCode;
  // players
  const old=new Map(players.map(p=>[p.id,p])), np=[];
  for(const q of s.p){
    const p=old.get(q.i)||{id:q.i,x:q.x,y:q.y,vx:0,vy:0,dx:0,dy:0,ang:q.a};
    Object.assign(p,{n:q.n,tx:q.x,ty:q.y,hp:q.h,max:q.m,dead:!!q.d,inv:q.iv?1:0,blades:q.bl,magnet:q.mg,c:q.c,rv:q.rv,spd:q.sp,nova:q.nv,r:10,pc:q.i===myId?(s.pc||null):null});
    if(Math.abs(q.a-p.ang)>.6) p.ang=q.a;
    np.push(p);
  }
  players=np;
  const olde=new Map(enemies.map(e=>[e.id,e])), ne=[], a=s.en;
  for(let i=0;i<a.length;i+=7){
    const T=TYPELIST[a[i+3]]; let e=olde.get(a[i]);
    if(!e) e={id:a[i],x:a[i+1],y:a[i+2],type:T.name,ti:a[i+3],r:T.r,col:T.col};
    e.tx=a[i+1];e.ty=a[i+2];e.flash=a[i+4]?1:0;e.hp=a[i+5];e.max=100;e.aux=a[i+6];
    ne.push(e);
  }
  enemies=ne;
  ebullets=[]; for(let i=0;i<(s.eb||[]).length;i+=4) ebullets.push({x:s.eb[i],y:s.eb[i+1],vx:s.eb[i+2],vy:s.eb[i+3]});
  if(s.sd!==mapSeed) genMap(s.sd);
  bullets=[]; for(let i=0;i<s.b.length;i+=5) bullets.push({x:s.b[i],y:s.b[i+1],vx:s.b[i+2],vy:s.b[i+3],c:s.b[i+4]});
  gems=[]; for(let i=0;i<s.g.length;i+=3) gems.push({x:s.g[i],y:s.g[i+1],k:s.g[i+2],heart:s.g[i+2]===3,v:[1,2,5,0][s.g[i+2]]});
  handleEvs(s.e||[]);
  if(prev!==state){ if(state==='dead'){deadAt=performance.now();noteBest();} syncMenu(); }
  if(screen==='game') updateLobbyList();
}
function clientStep(dt){
  const m=me();
  for(const p of players){
    if(p.id===myId){
      if(state==='play' && !p.dead){
        const i=getInput(), k=Math.min(1,dt*14), sm=inPool(p)?.55:1;
        p.vx+=(i.dx*p.spd*sm-p.vx)*k; p.vy+=(i.dy*p.spd*sm-p.vy)*k; p.x+=p.vx*dt; p.y+=p.vy*dt;
        pushOut(p);
      }
      const ex=p.tx-p.x, ey=p.ty-p.y, err=Math.hypot(ex,ey);
      const g=err>200?1:err>25?Math.min(1,dt*5):0;
      p.x+=ex*g; p.y+=ey*g;
    } else { const k=Math.min(1,dt*18); p.x+=(p.tx-p.x)*k; p.y+=(p.ty-p.y)*k; }
    if(p.blades) p.ang+=dt*(3.2+p.blades*.2);
  }
  const k=Math.min(1,dt*20);
  for(const e of enemies){e.x+=(e.tx-e.x)*k;e.y+=(e.ty-e.y)*k;}
  for(const b of bullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
  for(const b of ebullets){b.x+=b.vx*dt;b.y+=b.vy*dt;}
}

function handleEvs(list){

      case 'h': if(texts.length<45) texts.push({x:e[1],y:e[2],txt:e[3],life:.5,col:'#fff'}); burst(e[1],e[2],'#fff',2,120,2); break;
      case 'ph': burst(e[1],e[2],'#ff5577',18,260,4); if(e[3]===myId){shake=14;tone(120,.25,'sawtooth',.15,.5);} break;
      case 'ring': rings.push({x:e[1],y:e[2],r:10,max:e[3],t:0,col:e[4]}); break;
      case 'nova': shake=Math.max(shake,5); tone(160,.3,'sine',.14,.4); break;

      case 'gp': if(e[1]===myId){const n=performance.now(); if(n-lastGemSnd>40){lastGemSnd=n;tone(900+Math.random()*200,.04,'sine',.04);}} break;
      case 'heal': texts.push({x:e[1],y:e[2]-20,txt:'+20',life:.8,col:'#7dffb2'}); tone(660,.15,'sine',.1); break;
      case 'lv': [0,4,7,12].forEach((n,i)=>setTimeout(()=>tone(note(n),.18,'triangle',.12),i*70)); break;
      case 'up': burst(e[1],e[2],css(e[3]),24,260,4); rings.push({x:e[1],y:e[2],r:10,max:90,t:0,col:COLS[e[3]%6].join(',')}); tone(520,.1,'square',.08); break;
      case 'wave': banner='SWARM INCOMING'; bannerT=2; tone(90,.6,'sawtooth',.15,.5); break;
      case 'die': burst(e[1],e[2],'#fff',60,420,5); if(e[3]===myId) shake=26; tone(200,.8,'sawtooth',.2,.15); break;
      case 'rev': burst(e[1],e[2],'#7dffb2',40,320,4); rings.push({x:e[1],y:e[2],r:10,max:120,t:0,col:'125,255,178'}); [0,7,12].forEach((n,i)=>setTimeout(()=>tone(note(n),.15,'triangle',.12),i*60)); break;
      case 'over': shake=26; tone(110,.5,'sawtooth',.12); tone(82,.6,'sawtooth',.1); break;
      case 'go': tone(300,.2,'triangle',.12,2); break;
      case 'bossin': banner='BOSS INCOMING'; bannerT=2.5; tone(70,.9,'sawtooth',.2,.4); tone(55,1,'square',.1,.5); break;
      case 'boss': burst(e[1],e[2],'#ff2fd0',90,520,6); burst(e[1],e[2],'#fff',40,380,4); shake=24; banner='BOSS DOWN'; bannerT=2.5; [0,4,7,12,16].forEach((n,i)=>setTimeout(()=>tone(note(n),.25,'triangle',.14),i*80)); break;
    }
  }
}
function cosmetic(dt){
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96;p.life-=dt;}
  parts=parts.filter(p=>p.life>0);

// ================= map rendering =================
const hash2=(i,j)=>{let h=Math.imul(i,374761393)+Math.imul(j,668265263);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};
const ZONES=[[0,232],[600,215],[1000,165],[1400,25],[1800,5]];
function zoneHue(d){for(let i=1;i<ZONES.length;i++) if(d<=ZONES[i][0]){const a=ZONES[i-1],b=ZONES[i];return a[1]+(b[1]-a[1])*(d-a[0])/(b[0]-a[0]);}return 5;}
function drawMap(C,vw,vh){
  const T=performance.now()/1000, G=90;
  const L=C.x-vw/2-120, Rr=C.x+vw/2+120, Tp=C.y-vh/2-120, Bt=C.y+vh/2+120;
  const vis=(x,y,m=0)=>x>L-m&&x<Rr+m&&y>Tp-m&&y<Bt+m;

  ctx.save();
  ctx.beginPath();ctx.arc(0,0,ARENA,0,6.283);ctx.fillStyle='#0a0a16';ctx.fill();ctx.clip();

  // tiled floor, tinted by zone (stone plaza -> mossy ruins -> scorched rim)
  const i0=Math.floor(L/G),i1=Math.floor(Rr/G),j0=Math.floor(Tp/G),j1=Math.floor(Bt/G);
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){

function draw(){

  }

    const fc=e.flash>0?'#fff':e.col;

    if(e.ti===4){   // charger: square, glows white while winding up

  for(const x of texts){ctx.globalAlpha=Math.min(1,x.life*3);ctx.fillStyle=x.col;ctx.fillText(x.txt,x.x,x.y);}
  ctx.globalAlpha=1;

        ctx.fillStyle='#fff';ctx.font=`800 22px ${FONT}`;ctx.fillText(c.n,g.x+g.w/2,g.y+g.h*.45-o);
        ctx.fillStyle='rgba(255,255,255,.7)';ctx.font=`500 15px ${FONT}`;
        wrap(c.d,g.x+g.w/2,g.y+g.h*.45+30-o,g.w-30,20);
      });
    } else {
      ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,.8)';ctx.font=`700 20px ${FONT}`;ctx.fillText('waiting for teammates to pick…',W/2,H-60);
    }
  }
  if(state==='dead'){
    ctx.fillStyle='rgba(5,5,12,.7)';ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font=`900 64px ${FONT}`;ctx.fillText(players.length>1?'WIPED OUT':'YOU DIED',W/2,H*.38);
    ctx.font=`600 20px ${FONT}`;ctx.fillStyle='rgba(255,255,255,.85)';
    ctx.fillText(`survived ${mmss(t)} · ${kills} kills · level ${lvl}`,W/2,H*.38+40);
    ctx.fillStyle=t>=best?'#ffd23f':'rgba(255,255,255,.6)';ctx.fillText(t>=best?'NEW BEST':`best ${mmss(best)}`,W/2,H*.38+70);
    ctx.fillStyle='#7dffb2';ctx.fillText(isHost?'tap / space to go again':'waiting for host to restart…',W/2,H*.38+115);
  }
}
function wrap(text,x,y,maxW,lh){
  let line='';
  for(const w of text.split(' ')){
    const test=line+w+' ';
    if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line.trim(),x,y);y+=lh;line=w+' ';}else line=test;
  }
  ctx.fillText(line.trim(),x,y);
}

// ================= loop =================
let last=performance.now();
function frame(now){
  const dt=Math.min((now-last)/1000,1/30); last=now;
  if(screen==='game'){ if(isHost) hostStep(dt); else clientStep(dt); }
  cosmetic(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__swarm={get state(){return {screen,state,isHost,partyCode,players:players.length,enemies:enemies.length,t,myId}}, joinParty, createParty};
// auto-join from invite link
if(/^#[A-Za-z0-9]{4}$/.test(location.hash)) setTimeout(()=>joinParty(location.hash.slice(1)),300);
</script>
